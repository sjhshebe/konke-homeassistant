execute_scene:
  name: Execute scene
  description: Execute a Konke Smart scene by scene ID.
  fields:
    scene_id:
      name: Scene ID
      description: Konke sceneId, for example 123456.
      required: true
      selector:
        number:
          min: 1
          mode: box
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID. Only needed when multiple Konke accounts are configured.
      required: false
      selector:
        text: {}

refresh:
  name: Refresh
  description: Refresh Konke Smart cloud data for a config entry.
  fields:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID. Only needed when multiple Konke accounts are configured.
      required: false
      selector:
        text: {}

clear_forensic_history:
  name: Clear forensic history
  description: Permanently clear retained forensic events, baselines, and scene snapshots. Administrator access is required.
  fields:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID. Only needed when multiple Konke accounts are configured.
      required: false
      selector:
        text: {}
